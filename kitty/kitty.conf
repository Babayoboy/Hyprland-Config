# --- Fonts ---
font_family      FiraCode Nerd Font
foreground red
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Appearance ---
window_padding_width 8
background_opacity   0.30
confirm_os_window_close 0

# --- Cursor ---
cursor_shape         beam
cursor_blink_interval 0.5

# --- Sound ---
enable_audio_bell no
